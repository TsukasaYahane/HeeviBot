[package]
name = "qqbot-hermes"
version = "0.2.0"
edition = "2021"
description = "QQ 机器人（LLBot / OneBot 11）↔ DeepSeek Harness（DSH）桥接框架"

[dependencies]
tokio = { version = "1", features = ["full"] }
# OneBot 11 正向 WebSocket 客户端（连 LLBot）
tokio-tungstenite = "0.20"
futures-util = "0.3"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 日期
chrono = "0.4"
# 日报 PNG 渲染（本地绘制，无外部图片生成 API）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 报告长图直接写 256 色索引 PNG（体积约为真彩的 1/3）
png = "0.18"
fontdue = "0.9"

# 外部数据源 / 视觉模型的 HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# 便捷错误处理 + .env 加载
anyhow = "1"
dotenvy = "0.15"

# 心智系统（天使记忆/内心）：本地 SQLite 存储 + 内嵌 axum WebUI
rusqlite = { version = "0.31", features = ["bundled"] }
# 心智学习：中文分词 + 词性（替代「相邻两字」切分，抽词 / 定义 / 事实都按真实词边界）
jieba-rs = "0.7"
axum = "0.7"
sysinfo = "0.39.6"

[profile.release]
lto = "thin"

# 构建脚本带调试信息编译：本机卡巴斯基会拦截 release 版 zerocopy 构建脚本
# （os error 32/5，构建脚本被占用/拒绝执行），换成带 debuginfo 的产物即可正常运行。
# 只影响 build.rs 产物，不影响最终 bot 二进制。
[profile.release.build-override]
debug = true
